name: Publish wiki

# Mirrors .docs/wiki into the repository wiki. The wiki must be enabled and
# initialised once (create any page in the GitHub UI) before the first run,
# because GitHub only creates the wiki repository at that point.

on:
  push:
    branches: [main]
    paths:
      - ".docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Clone the wiki
        id: clone
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The wiki repository does not exist yet. Enable Wikis in Settings and create one page, then re-run this workflow."
          fi

      - name: Copy the wiki source
        if: steps.clone.outputs.ready == 'true'
        run: |
          set -euo pipefail
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp .docs/wiki/*.md wiki-repo/
          ls -1 wiki-repo/*.md

      - name: Commit and push
        if: steps.clone.outputs.ready == 'true'
        working-directory: wiki-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches .docs/wiki; nothing to publish."
            exit 0
          fi
          git commit -m "publish wiki from ${GITHUB_SHA::7}"
          git push
