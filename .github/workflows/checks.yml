name: checks

# The gaps document asks for a check on every push and pull request that
# type-checks, builds and compiles on all three platforms, so a change that
# breaks one of them cannot merge. No test runner appears here: this repository
# forbids self-written tests, and the checks below are the ones that fail on
# real breakage rather than on a changed line.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: interface (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: type-check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend
      - name: locale key counts match
        shell: bash
        run: |
          cd frontend/src/i18n
          for f in es de; do
            a=$(node -e "console.log(Object.keys(require('./en.json')).length)")
            b=$(node -e "console.log(Object.keys(require('./$f.json')).length)")
            [ "$a" = "$b" ] || { echo "en has $a keys, $f has $b"; exit 1; }
          done
      - name: the language pack has no blank rows
        shell: bash
        run: |
          cd frontend/src/i18n
          node -e "
            const s = require('fs').readFileSync('language-pack.ts','utf8');
            const table = s.split('\`')[1].split('\n').filter(Boolean);
            const bad = table.filter(l => l.split('|').length !== 10);
            if (bad.length) { console.error('rows with the wrong column count:', bad.length); process.exit(1); }
          "

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned on purpose. Installing the newest ruff on every run means a rule
      # added upstream fails a push that changed nothing here, which is how
      # these checks first went red.
      - name: tools, at fixed versions
        run: python -m pip install --upgrade pip && python -m pip install "ruff==0.16.8" "pytest==8.3.4"
      - name: engine dependencies
        run: pip install -r backend/requirements.txt
      # The Rust kernels, checked and built, so their tests run here rather than skip.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: native kernels
        shell: bash
        working-directory: backend/native
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
          python -m pip install "maturin==1.15.0"
          maturin build --release --out ../../native-dist
          python -m pip install ../../native-dist/*.whl
      - name: compile
        run: python -m compileall -q backend/app mcp
      - name: lint
        run: ruff check backend/app mcp setup tests
      - name: format
        run: ruff format --check backend/app mcp setup tests
      # The sturdiest thing about formcut is that preview and export go through
      # one renderer, and it is the easiest thing to lose quietly. These are
      # output checks, not tests of how anything is written: fixed projects
      # built from generated content only, so they render the same anywhere.
      # Golden frames compare exact pixels, and text is rasterised differently by
      # every platform's font stack, so the same correct render hashes
      # differently on macOS and Windows. They are pinned on one platform on
      # purpose: the check is for a change in our code, not in someone's
      # freetype build. The parity check inside it is platform-independent and
      # runs here too.
      # The suite runs everywhere, because it is the part that has to hold on
      # every platform. Only the pixel-exact checks below are pinned to one.
      # The tests make and read media by running ffmpeg, and no runner has it
      # installed: a release build carries formcut's own and the engine finds it,
      # but the tests call ffmpeg by name. Without it, every test that makes a
      # clip failed on all three runners. Linux keeps the ffmpeg and fonts the
      # golden frames below were pinned against.
      - name: ffmpeg for the tests (Linux, with the fonts the golden frames use)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: ffmpeg for the tests (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg for the tests (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: tests
        run: python -m pytest tests -q

      - name: golden frames, and preview against export
        if: matrix.os == 'ubuntu-latest'
        run: python setup/golden_frames.py

      # An export can finish and still produce a file of the wrong size, length
      # or codec, and an RPC reply can succeed while a renamed field breaks
      # every caller. Both are read back rather than assumed.
      - name: exports read back with ffprobe, and the RPC contract
        if: matrix.os == 'ubuntu-latest'
        run: python setup/output_checks.py

      - name: the engine imports and its routes mount once
        run: |
          python - <<'PY'
          import sys, collections
          sys.path.insert(0, "backend")
          from app.main import app
          paths = [f"{m}:{r.path}" for r in app.routes for m in getattr(r, "methods", {"GET"})]
          repeated = [p for p, n in collections.Counter(paths).items() if n > 1]
          assert not repeated, f"routes mounted more than once: {repeated}"
          print(len(paths), "routes, none repeated")
          PY

  shell:
    name: desktop shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # Tauri validates externalBin when the crate is compiled, and the frozen
      # engine is produced by the release workflow rather than this one. A check
      # job that had to freeze Python to compile Rust would take twenty minutes
      # to tell us about a syntax error, so a stub stands in for the sidecar.
      # It is named for the host triple, which is what tauri looks for, and it
      # never leaves the runner.
      - name: stub the engine sidecar so the shell can compile
        run: |
          triple=$(rustc -vV | awk '/^host:/ {print $2}')
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\necho "stub for cargo check"\n' > "src-tauri/binaries/formcut-engine-$triple"
          chmod +x "src-tauri/binaries/formcut-engine-$triple"
          echo "stubbed formcut-engine-$triple"
      # tauri::generate_context! also reads the built interface (frontendDist,
      # ../frontend/dist) when the crate compiles, and this job does not build
      # it, so cargo check stopped there before compiling any Rust. A one-page
      # stand-in is enough to compile; it never leaves the runner either.
      - name: stub the built interface so the shell can compile
        run: mkdir -p frontend/dist && printf '<!doctype html><title>formcut</title>\n' > frontend/dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      # Clippy reports rather than blocks until it has been seen to pass once on
      # a real runner; promoting it to -D warnings before that would fail every
      # push for warnings nobody has read.
      - name: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: rust formatting
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
