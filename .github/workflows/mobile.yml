name: mobile

# The phone shells in mobile/: an Android APK and an iOS simulator build. Both are
# debug builds until signing is set up. The APK installs on a phone that allows
# installing unknown apps; the simulator build runs in Xcode's iOS simulator.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npx tauri android init --ci
      - run: npx tauri icon ../src-tauri/icons/icon.png
      - run: npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v6
        with:
          name: formcut-android
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npx tauri ios init --ci
      - run: npx tauri icon ../src-tauri/icons/icon.png
      - run: npx tauri ios build --debug --target aarch64-sim
      - uses: actions/upload-artifact@v6
        with:
          name: formcut-ios-simulator
          path: mobile/src-tauri/gen/apple/build/
          if-no-files-found: error
