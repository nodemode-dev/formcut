name: release

# Builds downloadable desktop apps when a version tag is pushed, which is the
# first gap in the document: today, using formcut means installing Python, Node
# and ffmpeg and starting it from a clone.
#
# This workflow has never been run. It needs GitHub runners, an Apple Developer
# identity for notarization and a Windows signing certificate, none of which
# exist in the environment it was written in. Treat it as a starting point that
# a first tag will shake out, not as a proven pipeline. What it does is drawn
# from the scripts already in the repository: backend/freeze.py produces the
# frozen engine that src-tauri/tauri.conf.json expects at
# binaries/formcut-engine, and setup/build_*.sh wrap the same steps by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            target: aarch64-apple-darwin
          - os: macos-13
            label: macOS x86_64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows x86_64
            target: x86_64-pc-windows-msvc
          # ARM64 runners for the two platforms that were x86-only. Both are
          # ordinary hosted runners now, so neither needs emulation.
          - os: ubuntu-22.04-arm
            label: Linux arm64
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            label: Windows arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: system libraries for tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # The interface is built first because the frozen engine carries it.
      - name: build the interface
        run: |
          npm ci
          npm run build
        working-directory: frontend

      # PyPI's OpenCV brings its own FFmpeg, which freeze.py refuses, so OpenCV
      # is rebuilt without it first. The engine is frozen to one file and put
      # where externalBin looks for it. ffmpeg is not bundled: on first run the
      # app fetches formcut's LGPL build and checks every file against the
      # record it carries.
      - name: freeze the engine
        shell: bash
        run: |
          pip install -r backend/requirements.txt pyinstaller
          python backend/prepare_cv.py
          python backend/freeze.py --onefile
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          built=$(ls dist/formcut-engine$suffix backend/dist/formcut-engine$suffix 2>/dev/null | head -1)
          test -n "$built"
          mkdir -p src-tauri/binaries
          cp "$built" "src-tauri/binaries/formcut-engine-${{ matrix.target }}$suffix"

      # macOS and Windows installers carry formcut's LGPL ffmpeg from the
      # formcut-binaries release. Every file is checked against the record by
      # the same code the app's first-run fetch uses, and a mismatch fails the
      # build. The programs are staged under their plain names so the installed
      # app, which cannot be written to, needs no links. A target with no
      # published build is noted and fetches ffmpeg on first run instead. Linux
      # packages always do, since a packaged ffmpeg in /usr/bin would collide
      # with the system's.
      - name: bundle ffmpeg
        if: runner.os != 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os, sys, tempfile, urllib.request
          from pathlib import Path
          sys.path.insert(0, "backend")
          from app import ffmpeg_fetch
          triple = os.environ["TARGET"]
          record = ffmpeg_fetch.record()
          files = ffmpeg_fetch.pins(record, triple)
          if not files:
              print(f"::notice::no ffmpeg build is recorded for {triple}; this installer fetches it on first run")
              sys.exit(0)
          url = ffmpeg_fetch.source(record, triple)
          stage = Path("src-tauri/ffmpeg")
          with tempfile.TemporaryDirectory() as scratch:
              archive = Path(scratch) / "ffmpeg.tar.gz"
              try:
                  urllib.request.urlretrieve(url, archive)
              except OSError as error:
                  print(f"::notice::{url} is not published ({error}); this installer fetches ffmpeg on first run")
                  sys.exit(0)
              count = ffmpeg_fetch.install(archive, files, stage)
          suffix = ".exe" if triple.endswith("windows-msvc") else ""
          for program in ("ffmpeg", "ffprobe"):
              (stage / f"{program}-{triple}{suffix}").rename(stage / f"{program}{suffix}")
          print(f"bundled {count} files from {url}, each matching the record")
          PY

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # Linux gets all three package formats rather than the AppImage alone,
          # so a person who installs with their package manager is served too.
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.os, 'ubuntu') && '--bundles appimage,deb,rpm' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: formcut ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false

  collect:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: note
        run: |
          echo "tauri-action attaches .dmg, .msi, .AppImage, .deb and .rpm to the draft release."
          echo "Publish the draft once each artefact has been opened once on its own platform."
