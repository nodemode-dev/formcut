name: release

# Builds downloadable desktop apps when a version tag is pushed, which is the
# first gap in the document: today, using formcut means installing Python, Node
# and ffmpeg and starting it from a clone.
#
# This workflow has never been run. It needs GitHub runners, an Apple Developer
# identity for notarization and a Windows signing certificate, none of which
# exist in the environment it was written in. Treat it as a starting point that
# a first tag will shake out, not as a proven pipeline. What it does is drawn
# from the scripts already in the repository: backend/freeze.py produces the
# frozen engine that src-tauri/tauri.conf.json expects at
# binaries/formcut-engine, and setup/build_*.sh wrap the same steps by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            target: aarch64-apple-darwin
          - os: macos-13
            label: macOS x86_64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: system libraries for tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # ffmpeg and ffprobe travel inside the bundle so nothing has to be on the
      # user's PATH. Pin a build whose licence permits redistribution and record
      # which one in .docs/wiki/Licences.md before the first release.
      - name: fetch ffmpeg for the bundle
        run: python setup/fetch_ffmpeg.py --target ${{ matrix.target }} --out src-tauri/binaries
        continue-on-error: false

      - name: freeze the engine
        run: |
          pip install -r backend/requirements.txt pyinstaller
          python backend/freeze.py

      - name: build the interface
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: formcut ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false

  collect:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: note
        run: |
          echo "tauri-action attaches .dmg, .msi, .AppImage, .deb and .rpm to the draft release."
          echo "Publish the draft once each artefact has been opened once on its own platform."
