name: release

# Builds formcut for macOS (Apple Silicon), Windows (x86_64) and Linux (x86_64) and
# publishes them as one zip per platform on a GitHub release, each running with
# nothing else installed.
#
# A release is made by hand, never by a push: the maintainer runs this workflow
# on main (Actions, release, Run workflow; or gh workflow run release.yml --ref
# main). The first job reads APP_VERSION; if tag v<version> does not exist yet
# (a "chore(release)" commit bumped it), every platform builds and, only when all
# succeed, the tag and the release are made with their files. A version already
# released builds nothing unless the run asks to rebuild it, which replaces its
# files. A failed build makes no tag, so running it again tries again. It
# refuses to run from any branch but main.
#
# Intel Macs are not built: setup/build_macos_app --intel builds one on any Mac.
# The macOS app is signed ad hoc (tauri.conf.json: signingIdentity "-"), which
# needs no Apple account: without it Tauri leaves the bundle unsealed and macOS
# calls a downloaded copy damaged, with no way to open it. It is not notarized,
# so the release notes say how to open it the first time. Hardened runtime is
# off: it matters only for notarization, and its library validation would stop
# the one-file engine loading its own libraries and OpenH264 loading Cisco's.
# The Windows app is unsigned.

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild a version that is already released, replacing its files"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: which version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: read
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A release is made from main; this run is on $GITHUB_REF_NAME"
            exit 1
          fi
          version=$(python3 -c "import re; print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('backend/app/main.py').read(), re.M).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" = true ] || ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "building formcut $version"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released, so nothing was built. Bump the version to release a new one, or run again with rebuild to replace its files."
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            target: aarch64-apple-darwin
            bundles: --bundles app
          - os: windows-latest
            label: Windows x86_64
            target: x86_64-pc-windows-msvc
            bundles: --no-bundle
          # 22.04 so the AppImage runs on glibc 2.35 and newer.
          - os: ubuntu-22.04
            label: Linux x86_64
            target: x86_64-unknown-linux-gnu
            bundles: --bundles appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: system libraries for tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: the minimum macOS
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['bundle']['macOS']['minimumSystemVersion'])")" >> "$GITHUB_ENV"

      # The interface is built first because the frozen engine carries it.
      - name: build the interface
        run: |
          npm ci
          npm run build
        working-directory: frontend

      # The Rust kernels go into the engine, and an engine without them is refused,
      # as setup/build_macos_app does. PyPI's OpenCV brings its own FFmpeg, which
      # freeze.py refuses, so prepare_cv.py rebuilds it first.
      - name: freeze the engine
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller "maturin==1.15.0"
          python -m maturin build --release --manifest-path native/Cargo.toml --target "${{ matrix.target }}" --features gpu --out native-dist
          python -m pip install --force-reinstall --no-deps native-dist/*.whl
          python -c "import formcut_native; print('kernels load:', formcut_native.__file__)"
          # the executor every speed reading used (GpuFrame exists only with --features gpu): a release without it is refused
          python -c "import formcut_native, sys; sys.exit(0 if hasattr(formcut_native, 'GpuFrame') else 'the Rust kernels were built without the GPU executor')"
          python prepare_cv.py
          python freeze.py --onefile
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          check=$(./dist/formcut-engine$suffix --selfcheck)
          echo "$check"
          case "$check" in *'"native_kernels": true'*) ;; *) echo "the engine was frozen without formcut's Rust kernels"; exit 1 ;; esac
          mkdir -p ../src-tauri/binaries
          cp "dist/formcut-engine$suffix" "../src-tauri/binaries/formcut-engine-${{ matrix.target }}$suffix"

      # formcut's LGPL ffmpeg from the formcut-binaries release, every file checked
      # against the record by the code the app's first-run fetch uses.
      - name: bundle ffmpeg
        run: python setup/bundle_ffmpeg.py --target "${{ matrix.target }}"

      - name: build the app
        env:
          # linuxdeploy is an AppImage; extracting it lets it run without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --target "${{ matrix.target }}" ${{ matrix.bundles }}

      - name: package the zip
        run: python setup/package_release.py --target "${{ matrix.target }}"

      # The app as a person gets it: unzipped from the release zip, then checked
      # as Gatekeeper checks it. A signature that does not seal the bundle is what
      # macOS reports as damaged, so it stops the release here.
      - name: the downloaded macOS app is sealed
        if: runner.os == 'macOS'
        run: |
          unpacked=$(mktemp -d)
          ditto -x -k release-dist/*.zip "$unpacked"
          codesign --verify --deep --strict --verbose=2 "$unpacked/formcut.app"
          codesign -dv "$unpacked/formcut.app" 2>&1 | tee /dev/stderr | grep -q "Signature=adhoc"
          codesign --verify --strict "$unpacked/formcut.app/Contents/MacOS/formcut-engine"

      - uses: actions/upload-artifact@v6
        with:
          name: formcut-${{ matrix.target }}
          path: release-dist/*.zip
          if-no-files-found: error

  # The phone apps, unsigned as the owner chose: an APK signed with Android's
  # debug key (an APK needs some signature to install at all; the debug key
  # needs no account or secret), and an iOS IPA with no signature, which
  # AltStore, SideStore or Sideloadly sign with the installer's own Apple ID.
  # Each takes the release's version through --config, so the phone apps report
  # the version they were released as.
  android:
    name: Android arm64
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npx tauri android init --ci
      - run: npx tauri icon ../src-tauri/icons/icon.png
      - name: build the APK, signed with the debug key
        run: npx tauri android build --debug --apk --target aarch64 --config "{\"version\":\"$VERSION\"}"
      - name: name it for the release
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk" || { echo "no APK was built"; exit 1; }
          mkdir -p ../release-dist
          cp "$apk" "../release-dist/formcut-$VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: formcut-android
          path: release-dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS arm64
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npx tauri ios init --ci
      - run: npx tauri icon ../src-tauri/icons/icon.png
      # --no-sign (Tauri CLI 2.11.0 and later) archives without signing and packs
      # the .app into an IPA for third-party installers.
      - name: build the IPA, unsigned
        run: npx tauri ios build --no-sign --target aarch64 --config "{\"version\":\"$VERSION\"}"
      - name: name it for the release
        run: |
          ipa=$(find src-tauri/gen/apple -name '*.ipa' | head -n 1)
          test -n "$ipa" || { echo "no IPA was built"; exit 1; }
          mkdir -p ../release-dist
          cp "$ipa" "../release-dist/formcut-$VERSION-ios-arm64.ipa"
      - uses: actions/upload-artifact@v6
        with:
          name: formcut-ios
          path: release-dist/*.ipa
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [version, build, android, ios]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: release-dist
          merge-multiple: true
      - name: write the checksums, the manifest and the notes
        run: |
          python setup/release_manifest.py --version "$VERSION" --dir release-dist > manifest.json
          (cd release-dist && sha256sum -- *.zip *.apk *.ipa > SHA256SUMS)
          mv manifest.json release-dist/manifest.json
          python setup/release_notes.py --version "$VERSION" > notes.md
      - name: publish
        run: |
          ls -la release-dist
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release-dist/* --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" release-dist/* --target "$GITHUB_SHA" --title "formcut $VERSION" --notes-file notes.md
          fi
