# Lint settings for the engine.
#
# The check that runs on every push had never been configured, so it enforced
# whatever the installed ruff version happened to default to, and the engine had
# been failing it for a long time without anyone seeing. This file says what we
# actually want enforced, so the check means something and so a rule we
# deliberately do not follow is written down with its reason rather than
# rediscovered every time someone runs the linter.

target-version = "py312"
line-length = 140

# A standalone, standard-library-only tool the owner keeps in its own style; it
# is left out of lint and format rather than rewritten to this file's rules.
extend-exclude = ["setup/merge_macos_bundle_v1.0.0.py"]

[lint]
# The set the check was already applying, made explicit. Widening it is a
# separate decision from making the check pass, and mixing the two would hide
# which errors were real.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "DTZ", "ISC", "FURB", "PLW", "S", "SIM", "TRY", "ASYNC", "BLE"]

ignore = [
  # An engine whose job is to drive ffmpeg builds argument lists and calls a
  # program by name. These two rules exist to catch shell injection in code that
  # takes untrusted input; every call here is a fixed list this engine wrote,
  # never a string a person supplied.
  "S603", "S607",
  # A message written where it is raised reads better than a wrapper exception
  # class for every failure, and these messages are shown to people.
  "TRY003", "TRY300", "TRY301",
  # Re-raising with `from` inside FastAPI handlers adds a traceback the person
  # never sees; the HTTP error carries what matters.
  "B904",
  # A handful of module-level caches are written once and read everywhere, which
  # is what a cache is.
  "PLW0603",
  # Two routers are imported beside where they are mounted, deliberately, so the
  # mounting reads in one place.
  "E402",
  # Validation raises ValueError for a bad type on purpose. These errors are
  # caught at the edge and returned as 422 with their message; a TypeError would
  # be an internal fault and would come back as a 500.
  "TRY004",
  # Long lines are allowed where a line is a list of ffmpeg arguments and
  # breaking it would hide the shape of the command.
  "E501",
]

[lint.per-file-ignores]
# Cisco's OpenH264 licence must be reproduced exactly, curly apostrophes included.
"backend/app/openh264.py" = ["RUF001"]
# A test asserts. S101 exists to catch asserts used as runtime checks in
# shipped code, which is not what these are.
"tests/*" = ["S101"]
# Catching everything is the design in these three places, and each one says so
# where it does it: an effect package must never stop the engine starting, a
# background job must never take the process down with it, and a frame must
# still draw when something optional fails to.
"backend/app/effect_packages.py" = ["BLE001"]
"backend/app/jobs.py" = ["BLE001"]
"backend/app/renderer.py" = ["BLE001", "S110"]
"backend/app/frame_cache.py" = ["BLE001"]
"backend/app/proxies.py" = ["BLE001"]
"backend/app/stabilise.py" = ["BLE001"]
"backend/app/model_manager.py" = ["BLE001"]
# The agents' stdio launcher re-executes itself inside the engine's own venv
# (os.execv with a fixed argument list), probes the local engine at its fixed
# http://127.0.0.1 health address, and treats any failure of that probe as
# "the engine is not answering", which is the only answer it needs.
"setup/mcp_stdio.py" = ["S606", "S310", "BLE001"]
"backend/app/templates.py" = ["BLE001"]
"backend/app/encoders.py" = ["BLE001"]
"backend/app/gpu.py" = ["BLE001"]
"backend/app/gpu_effects.py" = ["BLE001"]
"backend/app/media.py" = ["BLE001", "ASYNC221"]
"backend/app/video_source.py" = ["BLE001", "SIM115"]
