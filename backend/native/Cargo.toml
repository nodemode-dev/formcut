[package]
name = "formcut-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "formcut's native render kernels, called from the Python engine"
publish = false

[lib]
name = "formcut_native"
crate-type = ["cdylib"]

[dependencies]
# All MIT or Apache-2.0. abi3 builds one module per platform for every Python from 3.10.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
rayon = "1.10"
# The frame path in Rust (R26), behind the `gpu` feature: the engine's own WGSL kernels recorded into one
# command buffer per frame with no Python between passes; wgpu talks to Metal, Vulkan or DX12 directly.
# Build with `maturin develop --release --features gpu`; without the feature the crate is the CPU kernels.
# wgpu's default features carry WGSL, Metal, DX12 and Vulkan (through wgpu-core); naming "vulkan" as a
# feature of the top-level crate is not a thing in 22, which the first build on the M5 said.
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.16", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[profile.release]
lto = "thin"
codegen-units = 1
# The kernel library is loaded by Python much as rustc loads a procedural macro, and
# on macOS 27 every stripped Rust library tried so far failed to load. Unstripped it
# is 2.4 MB instead of 0.7 MB (measured), which is nothing beside the engine.
strip = false

# Even with no strip setting, cargo strips release builds' debug info, procedural
# macros included (-C strip=debuginfo on their rustc lines). On macOS 27 with rustc
# 1.97.1 a stripped procedural macro cannot be loaded ("can't find crate" for
# pyo3_macros and indoc), so build-time crates are left unstripped.
[profile.release.build-override]
strip = false
