[package]
name = "formcut"
version = "0.56.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
regex = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true
