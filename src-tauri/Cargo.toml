[package]
name = "formcut"
version = "1.63.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
regex = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true

# Build scripts and procedural macros run during the build and never ship, and
# cargo strips them with the rest: -C strip=symbols with strip = true, and
# -C strip=debuginfo even with no strip setting. On macOS 27 with rustc 1.97.1 a
# stripped procedural macro cannot be loaded ("can't find crate"), here and in
# backend/native alike; left unstripped the builds succeed, and the app binary is
# stripped as before.
[profile.release.build-override]
strip = false
