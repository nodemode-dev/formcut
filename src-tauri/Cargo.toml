[package]
name = "formcut"
version = "2.15.7"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
regex = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }

[profile.release]
strip = false
lto = true

# Build scripts and procedural macros run during the build and never ship, and
# cargo strips them with the rest: -C strip=symbols with strip = true, and
# -C strip=debuginfo even with no strip setting. On macOS 27 with rustc 1.97.1 a
# stripped procedural macro cannot be loaded ("can't find crate"), here and in
# backend/native alike; left unstripped the builds succeed. The app binary is
# left unstripped too, since macOS builds fail on a stripped one.
[profile.release.build-override]
strip = false
